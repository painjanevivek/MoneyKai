version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:17"
      timezone: Asia/Kolkata
    # Routine version bumps are handled in planned maintenance windows. Keep
    # security updates enabled, but collapse them into one reviewable branch.
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - security
    commit-message:
      prefix: chore(deps)

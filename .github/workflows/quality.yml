name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency policy and lockfile evidence
        run: npm run security:lockfile-drift && npm run security:audit-dependencies:test && npm run security:audit-dependencies && npm run security:dependency-manifest:check

      - name: Typecheck mobile
        run: npm run mobile:typecheck

      - name: Typecheck web
        run: npm run web:typecheck

      - name: Lint mobile
        run: npm run mobile:lint

      - name: Lint web
        run: npm run web:lint

      - name: Check canonical API boundary
        run: npm run web:api-boundary:check

      - name: Test Vercel API handlers
        run: npm run api:test

      - name: Verify backup/restore release surface
        run: npm run backup-restore:gate

      - name: Check web release security
        run: npm run security:check

      - name: Validate deployment configuration contract
        run: npm run release:deployment-preflight:test && npm run release:deployment-preflight -- --require-sensitive-disabled

      - name: SMS production policy tests
        run: npm run mobile:test:capture

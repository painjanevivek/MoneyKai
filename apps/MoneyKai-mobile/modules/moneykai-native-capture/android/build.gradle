plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
}

group = 'com.moneykai'
version = '0.1.0'

android {
  namespace "com.moneykai.nativecapture"
  sourceSets.main.assets.srcDir new File(rootProject.projectDir, '../../../contracts/sms')
  sourceSets.main.assets.srcDir new File(rootProject.projectDir, '../src/services/models')

  compileSdkVersion rootProject.ext.has("compileSdkVersion") ? rootProject.ext.compileSdkVersion : 36

  defaultConfig {
    minSdkVersion rootProject.ext.has("minSdkVersion") ? rootProject.ext.minSdkVersion : 24
    targetSdkVersion rootProject.ext.has("targetSdkVersion") ? rootProject.ext.targetSdkVersion : 36
    versionCode 1
    versionName "0.1.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
}

dependencies {
  implementation 'net.zetetic:sqlcipher-android:4.19.1@aar'
  implementation 'androidx.sqlite:sqlite:2.7.0'
  implementation("com.facebook.react:react-android")
  implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

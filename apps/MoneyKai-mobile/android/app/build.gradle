apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def vectorIconsPackageDir = new File(["node", "--print", "require.resolve('react-native-vector-icons/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
project.ext.vectoricons = [
    iconFontNames: ["MaterialCommunityIcons.ttf", "Feather.ttf"],
    iconFontsDir: new File(vectorIconsPackageDir, "Fonts").getAbsolutePath(),
]
def vectorIconsFontsGradle = new File(["node", "--print", "require.resolve('react-native-vector-icons/fonts.gradle')"].execute(null, rootDir).text.trim())
apply from: vectorIconsFontsGradle

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

// The native entry point does not run Expo's useFonts. Bundle the exact font
// filenames referenced by the shared typography tokens into Android assets.
def moneyKaiFontAssets = layout.buildDirectory.dir('generated/moneyKaiFonts')
def copyMoneyKaiFonts = tasks.register('copyMoneyKaiFonts', Copy) {
    into moneyKaiFontAssets.map { it.dir('fonts') }
    ['outfit': ['400Regular', '500Medium', '600SemiBold', '700Bold'],
     'neuton': ['400Regular', '700Bold']].each { family, weights ->
        def packageDir = new File(['node', '--print', "require.resolve('@expo-google-fonts/${family}/package.json')"].execute(null, rootDir).text.trim()).parentFile
        weights.each { weight -> from(new File(packageDir, weight)) { include '*.ttf' } }
    }
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file("$projectRoot/index.js")
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

tasks.configureEach { task ->
    if ((task.name.startsWith('merge') && task.name.endsWith('Assets')) || task.name.toLowerCase(java.util.Locale.ROOT).contains('lint')) {
        task.dependsOn(copyMoneyKaiFonts)
    }
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
def moneyKaiUploadStoreFile = findProperty('MONEYKAI_UPLOAD_STORE_FILE') ?: System.getenv('MONEYKAI_UPLOAD_STORE_FILE')
def moneyKaiUploadStorePassword = findProperty('MONEYKAI_UPLOAD_STORE_PASSWORD') ?: System.getenv('MONEYKAI_UPLOAD_STORE_PASSWORD')
def moneyKaiUploadKeyAlias = findProperty('MONEYKAI_UPLOAD_KEY_ALIAS') ?: System.getenv('MONEYKAI_UPLOAD_KEY_ALIAS')
def moneyKaiUploadKeyPassword = findProperty('MONEYKAI_UPLOAD_KEY_PASSWORD') ?: System.getenv('MONEYKAI_UPLOAD_KEY_PASSWORD')
def hasMoneyKaiUploadSigning = moneyKaiUploadStoreFile && moneyKaiUploadStorePassword && moneyKaiUploadKeyAlias && moneyKaiUploadKeyPassword
def moneyKaiSmsResearchBuild = ((findProperty('MONEYKAI_SMS_RESEARCH_BUILD') ?: System.getenv('MONEYKAI_SMS_RESEARCH_BUILD')) ?: 'false').toBoolean()
def moneyKaiNativeSmsResearchBuild = ((findProperty('MONEYKAI_NATIVE_SMS_RESEARCH_BUILD') ?: System.getenv('MONEYKAI_NATIVE_SMS_RESEARCH_BUILD')) ?: 'false').toBoolean()
// These are distribution gates, not proof of Play approval. Review candidates
// must not be published before the SMS money-management exception is approved.
def moneyKaiSmsPolicyMode = (findProperty('MONEYKAI_SMS_POLICY_MODE') ?: 'disabled').toString()
def moneyKaiPreviewSmsReview = (findProperty('MONEYKAI_PREVIEW_SMS_REVIEW') ?: 'false').toString().toBoolean()
if (moneyKaiPreviewSmsReview && moneyKaiSmsPolicyMode != 'review') {
    throw new GradleException('SMS-enabled preview is internal testing only; use MONEYKAI_SMS_POLICY_MODE=review')
}
if (!(moneyKaiSmsPolicyMode in ['disabled', 'review', 'approved'])) {
    throw new GradleException('MONEYKAI_SMS_POLICY_MODE must be disabled, review, or approved')
}
def moneyKaiSmsReviewRequested = gradle.startParameter.taskNames.any { it.toLowerCase(java.util.Locale.ROOT).contains('smsreview') }
def moneyKaiSmsPolicyBuild = moneyKaiSmsReviewRequested || moneyKaiSmsPolicyMode != 'disabled'
def moneyKaiPreviewRequested = gradle.startParameter.taskNames.any { requestedTask ->
    requestedTask.toLowerCase(java.util.Locale.ROOT).tokenize(':').last().endsWith('preview')
}
def moneyKaiPlayRelease =
    ((findProperty('MONEYKAI_PLAY_RELEASE') ?: System.getenv('MONEYKAI_PLAY_RELEASE')) ?: 'false').toBoolean() ||
    moneyKaiPreviewRequested
def moneyKaiNotificationCapture = ((findProperty('MONEYKAI_NOTIFICATION_CAPTURE') ?: 'false').toString()).toBoolean()
if (moneyKaiNotificationCapture && moneyKaiPlayRelease) {
    throw new GradleException('Payment notification capture is a personal-use distribution opt-in; do not publish with the default Play profile.')
}
def moneyKaiUploadSigningError = "MoneyKai release/original builds require MONEYKAI_UPLOAD_STORE_FILE, MONEYKAI_UPLOAD_STORE_PASSWORD, MONEYKAI_UPLOAD_KEY_ALIAS, and MONEYKAI_UPLOAD_KEY_PASSWORD."

gradle.taskGraph.whenReady { taskGraph ->
    def needsUploadSigning = gradle.startParameter.taskNames.any { requestedTask ->
        def taskName = requestedTask.toLowerCase(java.util.Locale.ROOT).tokenize(':').last()
        taskName ==~ /(?:assemble|bundle|install|package)?(?:release|original)/
    }
    if (needsUploadSigning && !hasMoneyKaiUploadSigning) {
        throw new GradleException(moneyKaiUploadSigningError)
    }
}

android {
    sourceSets.main.assets.srcDir(files(moneyKaiFontAssets).builtBy(copyMoneyKaiFonts))
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.moneykai.mobile'
    defaultConfig {
        applicationId 'com.moneykai.mobile'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 18
        versionName "1.0.17"

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
        buildConfigField "boolean", "MONEYKAI_DEMO_BUILD", "false"
        buildConfigField "boolean", "MONEYKAI_NOTIFICATION_CAPTURE", moneyKaiNotificationCapture.toString()
        buildConfigField "boolean", "MONEYKAI_SMS_RESEARCH_BUILD", moneyKaiSmsResearchBuild.toString()
        buildConfigField "boolean", "MONEYKAI_NATIVE_SMS_RESEARCH_BUILD", moneyKaiNativeSmsResearchBuild.toString()
        buildConfigField "boolean", "MONEYKAI_SMS_POLICY_BUILD", moneyKaiSmsPolicyBuild.toString()
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasMoneyKaiUploadSigning) {
            release {
                storeFile file(moneyKaiUploadStoreFile)
                storePassword moneyKaiUploadStorePassword
                keyAlias moneyKaiUploadKeyAlias
                keyPassword moneyKaiUploadKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            signingConfig signingConfigs.debug
        }
        preview {
            initWith release
            applicationIdSuffix '.preview'
            versionNameSuffix moneyKaiPreviewSmsReview ? '-preview-sms-review-only' : '-preview'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            buildConfigField "boolean", "MONEYKAI_DEMO_BUILD", "true"
            buildConfigField "boolean", "MONEYKAI_SMS_POLICY_BUILD", moneyKaiPreviewSmsReview.toString()
        }
        smsReview {
            initWith release
            applicationIdSuffix '.smsreview'
            versionNameSuffix '-sms-review-only'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            buildConfigField "boolean", "MONEYKAI_SMS_POLICY_BUILD", "true"
        }
        release {
            if (hasMoneyKaiUploadSigning) {
                signingConfig signingConfigs.release
            }
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
        original {
            initWith release
            matchingFallbacks = ['release']
            if (hasMoneyKaiUploadSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    sourceSets.smsReview.manifest.srcFile('src/smsReview/AndroidManifest.xml')
    if (moneyKaiPreviewSmsReview) {
        sourceSets.preview.manifest.srcFile('src/main/sms-permission-manifest.xml')
    }
    sourceSets.smsReview.assets.srcDir(layout.buildDirectory.dir('generated/smsLab'))
    if (moneyKaiSmsPolicyMode != 'disabled') {
        sourceSets.release.manifest.srcFile(moneyKaiNotificationCapture ? 'src/main/sms-notification-permission-manifest.xml' : 'src/main/sms-permission-manifest.xml')
        sourceSets.original.manifest.srcFile(moneyKaiNotificationCapture ? 'src/main/sms-notification-permission-manifest.xml' : 'src/main/sms-permission-manifest.xml')
    } else if (moneyKaiNotificationCapture) {
        sourceSets.release.manifest.srcFile('src/main/notification-permission-manifest.xml')
        sourceSets.original.manifest.srcFile('src/main/notification-permission-manifest.xml')
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('android.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Only the research variant contains the offline inbox review and local trainer.
def buildSmsLab = tasks.register('buildSmsLab', Exec) {
    workingDir projectRoot
    commandLine 'node', 'scripts/build-sms-lab.mjs', layout.buildDirectory.dir('generated/smsLab').get().asFile.absolutePath
    inputs.files(fileTree("$projectRoot/scripts/sms-lab"), file("$projectRoot/scripts/build-sms-lab.mjs"),
        file("$projectRoot/src/services/offlineSmsEngine.ts"), file("$projectRoot/src/services/offlineSmsLearning.ts"),
        file("$projectRoot/src/services/models/offlineSmsModel.json"),
        file("$projectRoot/../../datasets/sms-parser-v1/offline-model/parity_fixtures.json"))
    outputs.dir(layout.buildDirectory.dir('generated/smsLab'))
}
tasks.matching { it.name == 'mergeSmsReviewAssets' ||
    (it.name.contains('SmsReview') && it.name.toLowerCase().contains('lint')) }.configureEach { dependsOn buildSmsLab }

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("androidx.core:core-splashscreen:1.0.1")
    implementation("androidx.credentials:credentials:1.5.0")
    implementation("androidx.credentials:credentials-play-services-auth:1.5.0")
    implementation("com.google.android.libraries.identity.googleid:googleid:1.1.1")
    // Private encrypted storage is shared by every build. Default manifests
    // remove the listener and SMS permissions; only the SMS review overlay
    // enables READ_SMS/RECEIVE_SMS. Never disable storage with capture flags.
    implementation project(":moneykai-native-capture")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

def moneyKaiFirebaseReleaseRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(java.util.Locale.ROOT).contains('release')
}
if (file("google-services.json").exists() ||
    (moneyKaiFirebaseReleaseRequested && file("src/release/google-services.json").exists())) {
    apply plugin: "com.google.gms.google-services"
} else {
    logger.lifecycle("[MoneyKai] google-services.json not found. Firebase will use the configured runtime project for auth and sync.")
}
